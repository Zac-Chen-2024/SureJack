<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    SureJack 的图标：竖屏画幅 + 底部字幕条。

    产品做的就是这件事——9:16 的竖版视频，字幕逐字点亮在下方。
    所以图标画的是这个形状本身，而不是一个通用的播放键或胶片格。

    在 16px 下要读得出来，所以只有两个元素：一个竖长方框、一条实心横杠。
    横杠用琥珀金（#f0b429，卡拉OK 高亮色，也是产品的强调色），
    框用中性灰——深浅两种浏览器主题下都看得清。
  -->
  <rect x="9" y="3" width="14" height="26" rx="3"
        fill="none" stroke="#9c9caa" stroke-width="2.2"/>
  <!-- 字幕条：偏下但不贴底，位置比例和成片里的 MarginV 观感一致 -->
  <rect x="12" y="21" width="8" height="2.6" rx="1.3" fill="#f0b429"/>
</svg>
